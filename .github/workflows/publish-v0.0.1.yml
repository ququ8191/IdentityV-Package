name: Publish IdentityV-Package v0.0.1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.0.1.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original line endings and build ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('d3dx.ini', 'README.md', 'LICENSE'):
              path = Path(name)
              path.write_bytes(path.read_bytes().replace(b'\n', b'\r\n'))
          PY
          zip -q -j IdentityV-Package-V0.0.1.zip LICENSE README.md d3dx.ini
      - name: Replace individual release assets with ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.0.1 IdentityV-Package-V0.0.1.zip --clobber
          for asset in d3dx.ini README.md LICENSE; do
            gh release delete-asset v0.0.1 "$asset" --yes
          done
          gh release edit v0.0.1 --notes '首次发布《第五人格》PC 端 3Dmigoto 配置包，配合 XXMI Launcher 使用。附件统一提供 IdentityV-Package-V0.0.1.zip。注意：d3dx.ini 的 [Loader] target 需按实际游戏进程修改。本项目不包含 3Dmigoto DLL 或 Mod 资源。'
